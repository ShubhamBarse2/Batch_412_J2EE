<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Page</title>
</head>
<body>

	<h2>Register</h2>

	<form action="register" method="post">

		<label>Full Name:</label><br> <input type="text" name="fullname"
			required><br>
		<br> <label>Email:</label><br> <input type="email"
			name="email" required><br>
		<br> <label>Password:</label><br> <input type="password"
			name="password" required><br>
		<br> <label>City:</label><br> <input type="text" name="city"
			required><br>
		<br> <label>Phone Number:</label><br> <input type="tel"
			name="phone" required><br>
		<br>

		<button type="submit">Register</button>

	</form>

</body>
</html>
